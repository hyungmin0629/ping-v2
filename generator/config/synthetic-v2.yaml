# =====================================================================
# synthetic-v2.yaml · 합성 데이터 v2 파라미터
# =====================================================================
# 이 파일은 docs/synthetic-v2-decisions.md 의 30개 질문에 대한 답이다.
# 각 항목의 [Qn] 은 그 질문 번호다. 팀에서 다른 답이 나오면 값만 바꾼다.
#
# ⚠️ 지금 값은 전부 "추천값"이다. 팀 확정 전에는 이 파일로 생성하지 않는다.
# ⚠️ 옛 distribution.yaml 과 달라진 곳에는 [변경] 표시를 달았다.
#
# 실측 = 구 서비스(final 스키마)에서 측정된 값. 근거 없이 바꾸지 말 것.
# =====================================================================

meta:
  version: "v2"
  seed: 20260803                # [Q29] 같은 시드 + 같은 config = 같은 데이터
  emit_manifest: true           # [Q29] output/manifest.json (시드·config해시·행수·commit)
  timezone_storage: "UTC"       # [Q27] 저장은 UTC
  timezone_behavior: "Asia/Seoul"   # [Q27] 행동 패턴은 KST 기준으로 만든다

# ---------------------------------------------------------------------
# 기간과 규모
# ---------------------------------------------------------------------
period:
  # [Q3 답] 웹앱 로그가 쌓이기 정확히 1년 전 ~ 쌓이기 전날.
  # 실측: user_session 최초 = 2026-07-29, app_user(실유저) 최초 = 2026-07-29.
  # 따라서 합성 구간과 실유저 구간이 겹치지 않고 정확히 맞닿는다.
  start_date: "2025-07-29"
  end_date:   "2026-07-28"
  months: 12

scale:
  users: 20000                  # [Q2 답] 20,000
  # [Q6 답] 2026-08-03 실측으로 4,000만 → 1억으로 올렸다.
  #   실측: 500명·1개월 = 115만 행 / 2,000명·3개월 = 601만 행 → 50 바이트/행
  #   추정: 20,000명·12개월 ≈ 8,500만 행 · CSV 4.3GB · BigQuery 3.5~5GB
  #   BigQuery 무료 저장이 10GB 이므로 저장은 문제가 아니다.
  # ⚠️ 진짜 위험은 행수가 아니라 **쿼리량**이다. Looker 가 raw 를 파티션 없이
  #    직접 보면 무료 한도 1TB/월을 넘긴다. P6 stg/mart 를 먼저 만들 것.
  max_total_rows: 100000000
  max_csv_bytes: 6000000000     # 6GB

# ---------------------------------------------------------------------
# 조직 — v1 최대 결함(10개 학교 집중)을 닫는 곳  [Q1]
# ---------------------------------------------------------------------
schools:
  master_source: "neis"         # [변경] 300개 합성 → DB에 있는 NEIS 실제 5,724개 사용
  master_count: 5724
  active_count: 50              # [Q1 답] 학교 50개
  # 활성 학교를 3계층으로. 균등 분산은 학급당 인원을 무너뜨린다.
  # 50개교 × 평균 400명 = 20,000명 (Q2 답과 맞물린다)
  # ⚠️ [변경 2026-08-04] 정원 합계가 유저 수보다 커야 한다. 옛 값은 기대 합계가
  #    약 18,900 이라 20,000명 중 1,100명이 정원을 넘겨 배정됐다(생성기가
  #    경고를 찍는다). 12% 여유를 두고 넓혔다 — 기대 합계 약 22,350.
  tiers:
    core:   { schools: 10, users_per_school: [800, 1150] }
    mid:    { schools: 15, users_per_school: [380, 700]  }
    tail:   { schools: 25, users_per_school: [60, 300]   }
  middle_ratio: 0.55            # 실측: 중 3,290 / 고 2,661
  classes_per_school: [9, 18]   # 실측 평균 15
  students_per_class: [14, 22]  # 실측: 같은 반 인원 평균 16.5

  # [Q5] 순차 확산 — 학교마다 첫 유저 유입일이 다르고 그 안에서 S자로 퍼진다
  adoption:
    mode: "sequential"
    core_start:  ["2025-09-01", "2025-09-20"]   # 핵심 학교가 먼저
    mid_start:   ["2025-10-01", "2026-03-31"]
    tail_start:  ["2026-02-01", "2026-07-01"]   # 3월 봄학기 스파이크를 신규 학교가 받친다
    intra_school_curve: "logistic"

# ---------------------------------------------------------------------
# 성장 곡선 — 이 파일에서 제일 중요한 블록  [Q4]
# ---------------------------------------------------------------------
growth:
  # [변경 2026-08-04] v2 는 "저점 → 회복 → 성장"이었다. 학교 기반 서비스에는
  # **봄학기(3월) 스파이크 뒤 서서히 감소**가 맞다고 판단해 바꿨다.
  # 신학기에 한 번 확 들어왔다가 학기가 굴러가면서 관심이 식는 모양이다.
  shape: "spring_spike"
  phases:
    - name: "launch_spike"
      range: ["2025-09-01", "2025-09-30"]
      signup_share: 0.35        # [변경] v1은 한 달에 93.9%. 완화 재현
      activity_multiplier: 1.0
    - name: "decline"
      range: ["2025-10-01", "2025-12-31"]
      signup_share: 0.15
      activity_multiplier: 0.45
    - name: "trough"
      # [변경] 1월 한 달 → **1~2월 두 달.** 겨울방학이 2월 초까지 이어지고
      # 신학기 전까지는 저점이 유지되는 것이 학사 일정과 맞다.
      range: ["2026-01-01", "2026-02-28"]
      signup_share: 0.05
      activity_multiplier: 0.18     # 겨울방학 최저점
    - name: "spring_spike"
      # [신설] 봄학기 시작. 9월(0.35)의 57% 규모 — 두 번째지만 더 작다.
      # 신규 학교(tail)의 진입이 여기에 겹친다.
      range: ["2026-03-01", "2026-03-31"]
      signup_share: 0.20
      activity_multiplier: 0.80
    - name: "slow_fade_1"
      range: ["2026-04-01", "2026-05-31"]
      signup_share: 0.15
      activity_multiplier: 0.60     # 스파이크 뒤 완만한 하강
    - name: "slow_fade_2"
      range: ["2026-06-01", "2026-07-31"]
      signup_share: 0.10
      activity_multiplier: 0.42     # 기말·여름방학이 겹치며 더 내려간다

  # [신설 2026-08-04] 계절 배수를 **세션 수에도** 적용할지.
  # false 면 배수가 세션의 *날짜만* 옮긴다 — 그런데 유저 대다수는 활동 창이
  # 짧아(same_day_only 26% · within_week 32%) 옮길 곳이 없다. 그래서 v2 에서
  # 겨울방학이 0.30 설정인데 실측 0.66배에 그쳤다. true 면 실제로 덜어낸다.
  seasonality_affects_volume: true
  # 방학·시험기간은 위 곡선 위에 곱해진다
  seasonality:
    summer_break: { range: ["2025-08-01", "2025-08-25"], multiplier: 0.35 }
    winter_break: { range: ["2025-12-24", "2026-02-05"], multiplier: 0.30 }
    exam_periods:  # 중간·기말 각 2주
      multiplier: 0.40
      weeks: ["2025-10-13", "2025-12-08", "2026-04-20", "2026-06-22"]

# ---------------------------------------------------------------------
# 유저
# ---------------------------------------------------------------------
users:
  gender_ratio_f: 0.586         # 실측: 여 396,665 / 남 280,418
  withdrawal_rate: 0.105        # 실측: 가입자의 10.5%
  withdrawal_free_text_rate: 0.35
  withdrawal_reason_weights:
    NO_FRIENDS: 0.30
    BORING_CONTENT: 0.27
    NOT_USING: 0.20
    OTHER: 0.12
    TOO_MANY_BUGS: 0.06
    PRIVACY: 0.05

retention:
  # ⚠️ [변경 2026-08-04] v1 실측에서 **의도적으로 벗어난다.**
  #    실측대로 두면 within_month(최대 29일) 위가 곧바로 long_term 이라
  #    "한 달과 장기 사이"가 비어 있다. 그 결과 12개월 코호트에서
  #    M1→M2 가 26%→4% 로 절벽이 됐다. 잔존 곡선의 모양 자체를 분석할 수
  #    없게 되므로 within_quarter(30~89일)를 넣고 나머지를 조금씩 덜었다.
  no_activity: 0.041            # 실측 그대로
  same_day_only: 0.260          # 실측 0.284
  within_week: 0.320            # 실측 0.355
  within_month: 0.240           # 실측 0.278
  within_quarter: 0.100         # [신설] 30~89일
  long_term: 0.039              # 실측 0.042
  # 휴면했다 돌아오는 유저 — 코호트 분석의 재료  [Q4]
  reactivation_rate: 0.09
  reactivation_window: ["2026-02-01", "2026-07-31"]
  # [신설] 복귀는 **봄학기에 몰리되 다른 달에도 있어야** 한다.
  # 3월에만 몰면 "복귀 = 3월"이 되어 코호트를 갈라볼 것이 없다.
  reactivation_month_weights:
    "2026-03": 3.0
    "2026-04": 1.5
    "2026-02": 1.0
    "2026-05": 1.0
    "2026-06": 0.8
    "2026-07": 0.6
  reactivation_days: [7, 45]    # 두 번째 활동 창의 길이. 첫 창보다 짧다

friends:
  per_user: [5, 60]
  per_user_median: 30
  # 허브 유저 — 학교 전체를 아는 사람.
  # ⚠️ 친구가 많으면 GLOBAL 후보 풀이 커져 투표 경험이 달라진다.
  #    "친구가 많은 유저는 다르게 행동하는가"를 물으려면 꼬리가 충분히 길어야 한다.
  #
  # ⚠️ [변경 2026-08-04] 200~700 → 아래. **인기도 집중의 절반이 여기서 나왔다.**
  #    친구가 162명이면 162명의 후보 목록에 오르고 39명이면 39번만 오른다 —
  #    노출이 4배다. zipf_alpha 는 후보 4명 중 누가 뽑히느냐만 정하므로
  #    아무리 낮춰도 이 부분이 안 줄어든다(실측: 0.80→52.6% / 0.45→50.7%,
  #    바닥이 약 48~49%). 꼬리를 유지하되 극단을 줄인다 — 중앙값 30 대비
  #    4~12배면 여전히 명백한 허브다.
  hub_ratio: 0.03
  hub_per_user: [80, 240]
  # 게이트를 못 넘는 유저. 남이 친구로 추가해도 고립이 유지돼야 한다
  # (양방향 유입을 막지 않으면 이 비율이 무의미해진다 — 실제로 그랬다).
  locked_hard: true
  same_school_ratio: 0.80       # 실측 79.6%
  same_class_ratio: 0.25        # 실측 23.7%
  request_accept_rate: 0.751    # 실측
  request_pending_rate: 0.230
  request_reject_rate: 0.019
  locked_user_ratio: 0.07       # 친구 5명 미만이라 서비스를 못 여는 유저
                                #   → 해금률 90~95% 를 노린다. 100% 는 비현실적이다
  unfriend_rate: 0.06           # 관계의 6%가 끊긴다 (ended_at 이 찍힌다. 행은 남는다)
  rejected_recommendation:      # [Q17] 실서비스 0행인 표를 채운다
    user_ratio: 0.15
    per_user: [1, 5]

sessions:
  per_active_day: [1, 4]
  duration_minutes: [2, 25]
  platform_ratio:               # [변경] v1은 iOS 68/AOS 32. ping-v2 는 웹앱이다
    WEB: 0.82
    ANDROID: 0.11               # 모바일 브라우저 UA 로 구분되는 몫
    IOS: 0.07
  hour_weights:                 # [Q23] KST. Looker 히트맵이 밋밋하지 않게
    "07-08": 1.4
    "12-13": 3.0                # 점심 최대 봉우리
    "17-19": 2.2
    "23-01": 1.8
    "other": 1.0
  weekend_multiplier: 0.55

# ---------------------------------------------------------------------
# 질문과 투표
# ---------------------------------------------------------------------
questions:
  count: 240                    # [Q19 답] 240개
  # [Q19 답] 외모·신체 질문도 포함한다 — 신고되는 비율을 보기 위해서다.
  # ⚠️ CLAUDE.md 의 "외모·신체 관련 질문 제외" 원칙을 바꾸는 결정이다.
  #    `question_category.is_sensitive` 로 표시하고 신고율을 따로 센다.
  # ⚠️ 2026-08-03 에 켰다. 카테고리도 함께 열었다(migration 012) —
  #    **실서비스에도 반영되는 변경이다.** 근거는 신고율 측정이다.
  #    비하로 읽힐 문장은 넣지 않는다. 칭찬 방향의 외모·스타일 질문만 쓴다.
  include_appearance: true
  appearance_ratio: 0.06
  sensitive_ratio: 0.18         # 외모 포함으로 12% → 18%
  user_submitted_ratio: 0.15
  request_count: 320            # [변경] 80 → 320 (12개월이므로)
  request_approve_rate: 0.45
  scope_ratio:                  # [Q20]
    CLASS: 0.35
    SCHOOL: 0.35
    GLOBAL: 0.30

voting:
  items_per_session: 10
  # ⚠️ 예전 sessions_per_active_user 는 **기간과 무관**했다. 1개월이든 12개월이든
  #    최대 40세션이라, 1개월 샘플이 12개월치 활동을 압축해 담았다(EDA 문제 ②).
  #    이제 **한 달당** 몇 번인지로 정의한다.
  # 활동 강도는 **잔존 구간별로 완전히 다르다.** 하나의 분포로 뭉개면
  # 오래 남은 헤비 유저와 하루 쓰고 떠난 유저가 같은 빈도를 갖는다.
  # ⚠️ 이 값은 "얼마나 자주 들어오는가"라는 **제품 가정**이지 실측이 아니다.
  sessions_per_month_by_tier:
    long_term:      [100, 200]  # 90일+ 잔존 = 활성 유저. 하루 3~7회
    within_quarter: [50, 110]   # [신설] 30~89일. 장기와 한 달 사이
    within_month:   [25, 70]    # 7~29일
    within_week:    [4, 20]     # 1~6일
    same_day_only:  [1, 4]      # 가입 당일만
    no_activity:    [0, 0]      # 앱을 연 적이 없다
  # 하트 일일 상한에 걸려도 투표는 계속한다 — 상한은 하트를 막지 행동을 막지 않는다.
  stop_voting_at_cap: false
  power_user_ratio: 0.06        # 소수가 활동 대부분을 만든다 (v1 0.7%보다 완화)
  power_user_multiplier: 6
  complete_rate: 0.963          # 실측: 문항 노출→투표 완료 96.3%
  # 세션을 끝까지 채우지 않고 나가는 비율. 없으면 퍼널 분석이 성립하지 않는다.
  session_abandon_rate: 0.22
  abandon_early_share: 0.60     # 이탈의 60%는 1~3번째 문항에서
  shuffle_rate: 0.18
  ad_complete_rate: 0.92
  padded_item_ratio: 0.18       # [Q20] 꼬리 학교에서 후보가 모자라는 상황을 실제로 만든다
  recent_exposure_days: 7       # 최근 후보로 나온 사람은 다시 안 뽑는다(풀이 모자라면 푼다)

  popularity:                   # [Q21] 분석의 재미가 여기서 결정된다
    enabled: true
    # **목표치.** 생성 끝에 실측과 나란히 출력된다.
    # ⚠️ [변경 2026-08-04] 0.45 → 0.49. 45% 는 **도달할 수 없는 값**이라는 것이
    #    실측으로 드러났다. 지목 쏠림의 바닥은 인기도 가중치가 아니라
    #    **활동 불균형**이다 — 투표를 하는 쪽 상위 10%가 전체 투표의 91.2%를
    #    만든다. 그 불균형이 친구 그래프를 통해 퍼진 것이 48.9% 다.
    #    더 내리려면 "소수가 활동 대부분을 만든다"(v1 실측)를 깨야 해서 안 한다.
    top10_share: 0.49
    # 실측 (4,000명·10학교·12개월 프로브, 최종과 같은 밀도) —
    #   1.35 → 64.2%   0.80 → 52.6%   0.45 → 48.8%   0.20 → 48.9%
    # 0.45 아래로는 **아무 효과가 없다.** 바닥에 닿았다는 뜻이다.
    # ⚠️ 1개월 샘플은 곡선이 꺼져 값이 다르게 나온다(0.80 이 45.0%).
    #    이 값을 바꾸면 **반드시 12개월로 재확인**할 것.
    zipf_alpha: 0.45            # 클수록 쏠린다
    scope: "class"              # 인기도는 학급 안에서 정해진다 (반의 스타 ≠ 전교의 스타)
    # 아무에게도 지목받지 못하는 사람이 있어야 한다. 전원이 최소 1표는 받는
    # 데이터는 "인기 없음"이라는 상태 자체를 지워버린다.
    never_picked_ratio: 0.04

  gender_homophily:             # [Q22] 성별이 힌트로 팔리는 구조의 근거
    romance_cross_gender: 0.78
    friendship_same_gender: 0.65

received:
  read_rate: 0.555              # 실측
  # 힌트는 **건별 확률이 아니라 사람의 성향**으로 산다.
  #   hint_buyer_ratio    : 힌트를 살 마음이 있는 사람의 비율 (나머지는 0회)
  #   hint_appetite_range : 사는 사람 안에서의 편차. 낮은 쪽이 두텁다
  # ⚠️ 이걸 나누기 전에는 모두에게 같은 확률을 적용해서, 힌트 횟수가
  #    받은 투표 수에만 따라갔다 — "힌트를 잘 사는 사람"이 없었다.
  hint_buyer_ratio: 0.86
  hint_appetite_range: [0.05, 0.85]
                                #   ⚠️ 실측 0.22 는 v1 기준인데, v1 은 받은 투표가
                                #   훨씬 많았다. 유저당 12건인 지금 0.22 를 쓰면
                                #   힌트를 한 번이라도 산 유저가 33% 밖에 안 된다.
  # [Q18 답] 힌트를 사지 않아도 답장할 수 있다. 두 경로를 나눠 센다.
  reply_rate_no_hint: 0.04      # 힌트 안 사고 답장
  reply_rate_with_hint: 0.20    # 힌트 사고 답장
  reply_report_rate: 0.02

# ---------------------------------------------------------------------
# 하트 경제  [Q24][Q25][Q26]
# ---------------------------------------------------------------------
hearts:
  # ⚠️ [변경·중요] v1 누진요금 [200,300,500,1000] 은 현행 스키마와 맞지 않는다.
  #    W14 는 '골라 사는 5+1' 구조다. v1 값을 쓰면 소비량이 10배로 부풀어
  #    경제 전체가 어긋난다.
  hint_basic_cost: 20           # 기본 5종 각 20하트
  hint_fullname_cost: 100       # 이름 공개. 기본 3개 이상 연 뒤에만
  hint_gender_by_ad_ratio: 0.30 # 성별 힌트를 광고로 여는 비율 → heart_cost=0 인 행이 생긴다
                                #   (정합성 검사 4번이 이걸 전제로 고쳐져 있다)
  signup_grant: 300             # 실측: point 최빈값 300
  # ⚠️ v1 실측은 5~15(평균 10)였다. 그대로 두면 적립이 소비의 8배가 된다 —
  #    v1 은 힌트가 200~1,000하트라 균형이 맞았지만 W14 에서 20하트로 내렸기 때문.
  #    실측을 버리는 결정이며, 근거는 힌트 단가 변경이다.
  vote_reward_weights:          # 하트: 확률
    2: 0.400
    3: 0.300
    4: 0.200
    5: 0.050
    6: 0.030
    7: 0.010
    8: 0.005
    9: 0.003
    10: 0.002
  reward_both_sides: true       # 실측: 투표자와 지목당한 쪽 양쪽 지급
  ad_reward: 0                  # 셔플 광고에는 보상이 없다. 광고는 오직 셔플을 위해 본다
  daily_earn_cap: 100           # 하루 적립 상한. 파워유저가 무한히 쌓는 것을 막는다
  topup_rate: 0.18              # [Q26 답] 18% (실측 8.74% 보다 높게 잡는다)
  topup_repeat: [1, 4]
  # [Q26 답] 헤비과금러가 존재해야 한다. 결제자의 4%가 결제액의 절반 가까이를 만든다.
  whale_ratio: 0.04             # 결제자 중 헤비과금러 비율
  whale_repeat: [12, 40]        # 헤비과금러의 결제 횟수
  product_weights:              # [Q26] 일반 결제자는 소액 편중
    cheapest: 0.55
    second: 0.25
    third: 0.14
    largest: 0.06
  whale_product_weights:        # 헤비과금러는 고액 편중
    cheapest: 0.05
    second: 0.15
    third: 0.30
    largest: 0.50
  use_stub_prefix: false        # [Q26] 합성은 실결제로. MVP-STUB- 는 실유저 쪽에만
  target_end_balance_under_100: 0.60   # [Q25] 완만한 부족. 남아돌면 결제 근거가 없다

  # [Q7] 하트·원장 불일치는 재현하지 않는다. 예외 없음.
  ledger_consistency: "strict"  # balance == SUM(heart_transaction). 생성 후 자체 검사

# ---------------------------------------------------------------------
# 게시판  [Q14] — 생성기 신규
# ---------------------------------------------------------------------
board:
  author_ratio: 0.40            # [Q14 답] 활성 유저의 40%가 글을 쓴다
  commenter_ratio: 0.70         # [Q14 답] 활성 유저의 70%가 댓글을 쓴다
  posts_per_author: [1, 25]
  author_pareto_top5_share: 0.40
  comments_per_post_mean: 2.5   # [Q14 답] 글 1개당 댓글 2~3개
  zero_comment_post_ratio: 0.30
  post_likes_per_post_mean: 4.0 # [Q14 답] 좋아요 4개
  # [Q14 답] 좋아요가 압도적으로 높은 게시글이 존재해야 한다 (떡상 글)
  viral_post_ratio: 0.02
  viral_post_likes: [80, 400]
  comment_like_ratio: 0.18
  cross_school: false           # 학교 경계 안에서만

# ---------------------------------------------------------------------
# 신고·제재·차단  [Q15] — 생성기 신규
# ---------------------------------------------------------------------
moderation:
  reports_per_1000_vote_items: 4
  reviewed_rate: 0.70           # 30% 는 PENDING 으로 고인다 — 버그가 아니라 운영 현실
  actioned_rate: 0.25           # 검토된 것 중 제재로 이어진 비율
  # [신설 2026-08-04] 민감 질문이 몇 배 더 신고되는가.
  # ⚠️ v2 는 신고 대상 질문을 **완전 균등**하게 골랐다. 그래서 APPEARANCE(0.439)와
  #    HUMOR(0.379)가 사실상 같았고, `is_sensitive` 플래그가 데이터에서 아무 의미도
  #    갖지 못했다. 외모 카테고리를 연 목적이 신고율 측정이었으므로 이건 실패다.
  #    이 배수가 그 신호를 만든다.
  sensitive_report_multiplier: 3.5
  # ⚠️ report_target ENUM 은 USER·QUESTION·POST·COMMENT 넷뿐이다.
  #    투표 신고와 답장 신고는 **USER 신고**로 들어간다 — 신고 대상이 콘텐츠가
  #    아니라 사람이기 때문이다. Q15 에 적었던 '투표·답장' 은 별도 타입이 아니다.
  target_type_mix:              # 한 종류만 나오면 신고 화면 분석이 안 된다
    USER: 0.42
    POST: 0.26
    COMMENT: 0.22
    QUESTION: 0.10
  block:
    user_ratio: 0.03
    per_user: [1, 4]

# ---------------------------------------------------------------------
# 학교 정보 6표  [Q16] — 생성기 신규 (일부는 NEIS 실수집)
# ---------------------------------------------------------------------
school_info:
  # [Q16 답] NEIS API 를 새로 부르지 않는다. 지금 DB 에 있는 학교 데이터를
  #          본떠 50개 학교분으로 늘린다(문장 구조·메뉴 조합을 섞어 재조합).
  source: "replicate_existing"
  replicate_from_schools: 20    # 지금 실데이터가 있는 학교 수
  replicate_to_schools: 50      # 활성 학교 수 (Q1 답)
  meal:        { weekdays_only: true, items_per_meal: [4, 7] }
  event:       { per_school_per_month: [2, 4] }
  timetable:   { periods_per_week: 30 }
  notice:      { per_school_per_month: [2, 4] }
  notice_read: { read_ratio: [0.20, 0.60] }

# ---------------------------------------------------------------------
# 텍스트  [Q12][Q13]
# ---------------------------------------------------------------------
text:
  mode: "corpus"                # 템플릿 + 미리 만들어 커밋한 코퍼스. LLM 을 생성 경로에 두지 않는다
  corpus_dir: "generator/corpus"
  # [Q12·Q13 답] 닉네임은 별명이 아니라 **본명처럼** 만든다 (예: 김형민)
  nickname_style: "realname"
  forbid:
    real_person_names: false    # [Q13 답] 본명 형태를 허용한다 (실존 인물 대조는 하지 않는다)
    real_school_names: false    # [Q13 답] 학교명은 NEIS 실명 그대로
    phone_email_patterns: true  # [Q13 답] 전화번호·이메일 문자열은 만들지 않는다
    profanity: false            # [Q13 답] 신고 사유에 실제 욕설이 있어도 괜찮다

# ---------------------------------------------------------------------
# 일부러 심는 이상치  [Q9]
# ---------------------------------------------------------------------
anomalies:
  enabled: true
  emit_answer_key: "generator/output/anomalies.json"   # 분석자에게 주지 않는다
  patterns:
    - { name: "vote_abuser",     users: 5,  votes_per_day: 200 }
    - { name: "night_only",      users: 12, active_hours: [3, 5] }
    - { name: "repeat_targeter", users: 20, target_concentration: 0.85 }
  # 전부 정상 스키마 안에서 표현된다. 제약 위반이 아니라 통계적 이상치여야 한다

# ---------------------------------------------------------------------
# 파이프라인 실증  [Q28]
# ---------------------------------------------------------------------
incremental_batch:
  enabled: true
  window_days: 7                # 마지막 7일치를 2차 배치로 분리
  include_updates: true         # INSERT 만 있으면 증분의 절반만 시험한 것이다
  update_kinds: ["nickname_change", "unfriend", "report_review", "post_delete"]

# ---------------------------------------------------------------------
# 완료 판정  [Q11][Q30]
# ---------------------------------------------------------------------
gates:
  integrity_checks: true        # qa/checks/integrity.sql 17종 위반 0
  column_coverage:
    enabled: true
    min_non_null_ratio: 0.01    # 342컬럼 전부가 비-NULL 1% 이상
    report: "generator/output/column_coverage.md"
    # 1% 를 못 넘는 것이 정상인 컬럼. **사유 없이 넣지 말 것** —
    # 화이트리스트가 늘어나는 만큼 이 검사는 쓸모가 없어진다.
    whitelist:
      # 설계상 반드시 NULL. 합성 유저는 Supabase 익명 계정이 없고,
      # 이 NULL 자체가 실유저/합성을 가르는 신호다(10_reference_user.sql 주석).
      - "app_user.auth_user_id"
      # 드물어서 1% 를 못 넘는 것들. 값은 실제로 들어간다.
      - "heart_transaction.purchase_id"    # 결제 거래는 전체 거래의 0.1%대
      - "heart_transaction.admin_id"       # 운영자 보정은 더 드물다
      - "heart_purchase.failure_reason"    # 실측 결제 실패율 0.17%
                                           #   ⚠️ 500명 샘플에서는 기대값이 0.4건이라
                                           #   아예 안 나올 수 있다. 규모에 따라 채워진다.
  table_coverage: true          # 40표 전부 1행 이상
  verify_load: true             # 1차 + 2차 증분 행수 대조
  distribution_report:          # 사람이 눈으로 본다 — 기계는 이상한 곡선을 못 막는다
    enabled: true
    output: "generator/output/distribution_report.md"
