# =====================================================================
# distribution.yaml · 합성 데이터 분포 파라미터
# =====================================================================
# 여기 숫자를 바꾸고 generate.py 를 다시 돌리면 다른 데이터가 나온다.
# 코드를 고칠 필요 없다.
#
# 대부분의 값은 구 서비스(final 스키마) 실측치에서 가져왔다.
# "실측" 주석이 붙은 것은 실제 데이터에서 측정된 값이다.
# =====================================================================

seed: 20260729          # 같은 시드 = 같은 데이터 (재현성)
months: 3
start_date: "2026-04-01"

# ---------------------------------------------------------------------
# 조직
# ---------------------------------------------------------------------
schools:
  count: 300                   # 학교 마스터 총 개수 (NEIS 연동 대상)
  middle_ratio: 0.55           # 실측: 중학교 3,290 / 고교 2,661 → 55%
  classes_per_school: [9, 18]  # 학년×반 조합. 실측 평균 15개
  students_per_class: [14, 22] # 실측: 유저당 같은 반 인원 평균 16.5명

  # ⚠️ 유저를 전체 학교에 균등 분산시키면 안 된다.
  # 5,000명을 300개 학교에 고루 뿌리면 학급당 1.2명이 되어
  # "같은 반 친구"를 뽑을 풀 자체가 사라진다.
  #
  # 실제 서비스도 5,951개 학교 중 단 10곳에만 활동이 몰려 있었다.
  # 그래서 일부 학교만 밀도 있게 채우고 나머지는 비워 둔다.
  # 빈 학교도 마스터로는 남아 NEIS 급식·시간표 연동 대상이 된다.
  fill_active_schools: true

# ---------------------------------------------------------------------
# 유저
# ---------------------------------------------------------------------
users:
  count: 5000
  gender_ratio_f: 0.586        # 실측: 여 396,665 / 남 280,418
  signup_curve: launch_spike   # 초반 집중 유입 (구 서비스 2023-05 패턴)
  signup_spike_ratio: 0.6      # 60%가 첫 2주에 가입

# ---------------------------------------------------------------------
# 친구 그래프 — GLOBAL 스코프가 "친구 전체"이므로 이게 투표의 토대다
# ---------------------------------------------------------------------
friends:
  per_user: [5, 60]            # 최소 5명 = 서비스 이용 게이트
  per_user_median: 30
  same_school_ratio: 0.80      # 실측 79.6%
  same_class_ratio: 0.25       # 실측 23.7%
  request_accept_rate: 0.751   # 실측: 수락 75.1%
  request_pending_rate: 0.230  # 실측: 대기 23.0%
  request_reject_rate: 0.019   # 실측: 거절 1.9%
  # 친구 5명 미만이라 서비스를 못 여는 유저 비율
  locked_user_ratio: 0.08

# ---------------------------------------------------------------------
# 리텐션 — 구 서비스는 초반 이탈이 극심했다. 그 모양을 재현한다.
# ---------------------------------------------------------------------
retention:
  no_activity: 0.041           # 실측 4.1% - 가입 후 아무것도 안 함
  same_day_only: 0.284         # 실측 28.4%
  within_week: 0.355           # 실측 35.5% (1~6일)
  within_month: 0.278          # 실측 27.8% (7~29일)
  long_term: 0.042             # 실측 4.2% (30일+)

# ---------------------------------------------------------------------
# 질문
# ---------------------------------------------------------------------
questions:
  count: 240
  scope_ratio:                 # CLASS / SCHOOL / GLOBAL 배분
    CLASS: 0.35
    SCHOOL: 0.35
    GLOBAL: 0.30
  user_submitted_ratio: 0.15   # 유저 제안이 승인되어 올라온 비율
  request_count: 80            # 질문 요청 총 건수
  request_approve_rate: 0.45

# ---------------------------------------------------------------------
# 투표
# ---------------------------------------------------------------------
voting:
  items_per_session: 10
  sessions_per_active_user: [1, 40]
  power_user_ratio: 0.06       # 소수가 활동 대부분을 만든다 (구 서비스 0.7%보다 완화)
  power_user_multiplier: 6
  complete_rate: 0.963         # 실측: 노출→투표완료 96.3%
  shuffle_rate: 0.18           # 후보가 마음에 안 들어 셔플하는 비율
  ad_complete_rate: 0.92       # 셔플용 광고를 끝까지 본 비율

# ---------------------------------------------------------------------
# 지목받은 뒤의 행동
# ---------------------------------------------------------------------
received:
  read_rate: 0.555             # 실측: 열람 55.5%
  reveal_rate: 0.22            # 열람자 중 힌트를 사는 비율
  answer_public_rate: 0.165    # 실측: 열람자 중 공개 16.5%
  answer_private_rate: 0.012

# ---------------------------------------------------------------------
# 하트 경제
# ---------------------------------------------------------------------
hearts:
  signup_grant: 300            # 실측: point 최빈값 300
  vote_reward: [5, 15]         # 실측: 5~15 균등, 평균 9.99
  reward_both_sides: true      # 실측: 투표자와 지목당한 사람 양쪽 지급
  ad_reward: 30
  hint_cost_steps: [200, 300, 500, 1000]   # 실측: 누진 요금
  topup_rate: 0.087            # 실측: 결제 전환율 8.74%
  topup_repeat: [1, 4]         # 실측: 결제자 1인당 평균 1.61회

# ---------------------------------------------------------------------
# 이탈 / 신고
# ---------------------------------------------------------------------
withdrawal:
  rate: 0.105                  # 실측: 가입자의 10.5%
  reason_weights:
    NO_FRIENDS: 0.30
    BORING_CONTENT: 0.27
    TOO_MANY_BUGS: 0.06
    PRIVACY: 0.05
    NOT_USING: 0.20
    OTHER: 0.12
  free_text_rate: 0.35         # 자유 서술을 남기는 비율

reports:
  rate_per_1000_items: 4       # 투표 1,000건당 신고 건수
  reviewed_rate: 0.7
  actioned_rate: 0.25          # 검토된 신고 중 실제 제재로 이어진 비율

sessions:
  per_active_day: [1, 4]
  duration_minutes: [2, 25]
  platform_ratio:              # 실측: iOS 68.4% / Android 31.6%
    IOS: 0.55
    ANDROID: 0.30
    WEB: 0.15
